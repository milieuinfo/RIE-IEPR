---
version: 2

plan:
  project-key: RIEIEP
  key: SPEC
  name: RIE-IEPR Datamodel Specificatie

stages:
  - Build and Package Stage:
      jobs:
        - build-specificatie
  - Release and Publish Stage:
      jobs:
        - release-and-publish
  - Verify Release Stage:
      jobs:
        - verify-release

# Job definitions
build-specificatie:
  requirements: &requirements
    - Docker
    - Git
    - REMOTE_ONLY
  tasks:
    - clean
    - script: |
        #!/bin/bash
        set -e
        git config --global init.defaultBranch main || true
    - checkout
    - script: |
        #!/bin/bash
        set -e
        export NPM_CONFIG_LOGLEVEL=warn
        # ensure artifact folder exists even when generation failed
        mkdir -p build-artifact
        # Docker is required for npm steps in this plan
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker is required on the agent for this job"; exit 1
        fi
        # run in the specificatie subfolder where package.json lives
        docker run --rm -v "$PWD":/app -w /app/documentatie/bin/specificatie node:24-alpine sh -c '
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || exit 1
          else
            npm install --no-audit --no-fund --no-optional || exit 1
          fi
          npm run generate:bikeshed
        '
    - script: |
        #!/bin/bash
        set -e
        # build:docker expects Docker on the host; ensure it's present
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker is required on the agent for building the docker image"; exit 1
        fi
        # run build:docker from the specificatie folder
        (cd documentatie/bin/specificatie && docker build -t specificatie:latest . && docker run -v "$PWD":/app specificatie:latest) || true
    - script: |
        #!/bin/bash
        # ensure artifact folder exists even when generation failed
        mkdir -p build-artifact
        if [ -f documentatie/bin/specificatie/index.html ]; then cp -f documentatie/bin/specificatie/index.html build-artifact/; else echo "index.html not found; build-artifact will be empty"; fi
        echo "Build and package stage completed. index.html copied to build-artifact if it existed."
  artifacts:
    - name: artifact-specificatie
      location: build-artifact
      pattern: '**/*.*'
      shared: true

release-and-publish:
  requirements: *requirements
  tasks:
    - clean
    - script: |
        #!/bin/bash
        set -e
        git config --global init.defaultBranch gh-pages || true
    - checkout
    - script: |
        #!/bin/bash
        set -e
        # prepare gh-pages branch and clean working tree so it will only contain what we add
        git config user.email "bamboo@ci"
        git config user.name "Bamboo CI"
        git fetch origin gh-pages:gh-pages
        git checkout gh-pages
    - artifact-download:
        source-plan: RIEIEP-SPEC
        artifacts:
          - name: artifact-specificatie
            destination: build-artifact
    - script: |
        #!/bin/bash
        echo "Starting release and publish stage. Contents of build-artifact:"
        ls -la build-artifact || true
        set -e
        SECRET_GITHUB_TOKEN='${bamboo.github_secret_access_token}'
        GITHUB_REPO='milieuinfo/RIE-IEPR'
        export SECRET_GITHUB_TOKEN
        export GITHUB_REPO
        # minimal site files: copy artifact into index.html or fail
        if [ -f build-artifact/index.html ]; then
          echo "Found index.html in build-artifact; copying to workspace root"
          cp -f build-artifact/index.html index.html
        elif [ -f index.html ]; then
          echo "Found index.html in workspace root; using that"
        else
          echo "Required artifact missing: build-artifact/index.html"
          exit 1
        fi
        git add index.html .nojekyll
        echo "Committing and pushing to gh-pages branch of ${GITHUB_REPO}"
        git commit -m "Update spec site from Bamboo ${bamboo.buildNumber}"
        git push "https://${SECRET_GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" HEAD:gh-pages --force

verify-release:
  requirements: *requirements
  tasks:
    - clean
    - script: |
        #!/bin/bash
        git config --global init.defaultBranch main || true
    - checkout
    - script: |
        #!/bin/bash
        set -e
        GITHUB_REPO='milieuinfo/RIE-IEPR'
        export GITHUB_REPO
        git ls-remote --heads "https://github.com/${GITHUB_REPO}.git" gh-pages | grep refs/heads/gh-pages || (echo "gh-pages branch missing"; exit 1)
