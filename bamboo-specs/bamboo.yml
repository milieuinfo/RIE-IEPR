
version: 2

plan:
  project-key: RIE
  key: SPEC
  name: Specificatie build & deploy

stages:
  - Stage: Build
    jobs:
      - Job: BUILD
        key: BLD
        tasks:
          - checkout: []
          - script:
              interpreter: "/bin/bash"
              scripts:
                - export NPM_CONFIG_LOGLEVEL=warn
                - npm ci
                - npm start
                - npm run build:docker

  - Stage: Deploy
    jobs:
      - Job: DEPLOY
        key: DEP
        tasks:
          - checkout: []
          - script:
              interpreter: "/bin/bash"
              scripts:
                - set -e
                - echo "Preparing gh-pages push"
                - if [ -z "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN not set"; exit 1; fi
                - if [ -z "$GITHUB_REPO" ]; then echo "GITHUB_REPO not set (format: owner/repo)"; exit 1; fi
                - git config user.email "bamboo@ci"
                - git config user.name "Bamboo CI"
                - git fetch origin
                - git checkout -B gh-pages
                - cp -f index.html index.html
                - git add -A
                - git commit -m "Update spec site from Bamboo ${bamboo.buildNumber}" || true
                - git push "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" gh-pages --force

