# Structuur: mjv-database -> exploitatie LDES-stream via:
#   postgres-mjv (PostGIS, schema + testdata)
#     -> LDIO (Ldio:RdbmsInput leest de DB en genereert de turtle -> datamodel-
#              transformaties (DATAPLATFORM.md) via SparqlConstructTransformer
#              -> HttpOut)
#       -> ldes-server (enkele eventstream: exploitatie, by-page + by-time views)
services:
  ldes-server:
    image: openldes/ldes-server:4.1.1
    environment:
      - SPRING_CONFIG_LOCATION=/config/
    volumes:
      - ./server/application.yaml:/config/application.yaml:ro
    ports:
      - "8081:8080"
    networks:
      - ldes-server
      - ldio
    depends_on:
      - postgres
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1
      interval: 5s
      timeout: 3s
      retries: 500
      start_period: 10s

  postgres:
    container_name: ldes-postgres
    image: postgres:16-alpine
    ports:
      - 5434:5432
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=admin
      - POSTGRES_DB=ldesserver
    networks:
      - ldes-server
    healthcheck:
      test: pg_isready -U admin || exit 1
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 5s

  postgres-mjv:
    container_name: ldes-postgres-mjv
    image: postgis/postgis:16-3.4-alpine
    ports:
      - 5438:5432
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=admin
      - POSTGRES_DB=structuur
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - mjv
    healthcheck:
      test: pg_isready -U admin || exit 1
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 5s

  sleep-ldes:
    container_name: sleep-ldes
    image: busybox
    command: ["sh", "-c", "sleep 60"]
    depends_on:
      ldes-server:
        condition: service_healthy

  create-eventstreams:
    image: alpine/curl:latest
    volumes:
      - ./server:/config/server:ro
    depends_on:
      ldes-server:
        condition: service_healthy
      sleep-ldes:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        export SERVER_URL=http://ldes-server:8080
        export STREAMS="
        exploitatie
        "
        post_to_admin() {
          echo "creating $$1 with body content of file $$2"
          curl -X POST "$${SERVER_URL}/$$1" \
            -H "Content-Type: text/turtle" \
            -d @/config/server/$$2 \
            -w "\nHTTP status: %{http_code}\n" \
            --fail-with-body || echo "Warning: failed to create $$1 (it may already exist)"
        }
        echo "Waiting for LDES server to be ready..."
        until curl -sf "$${SERVER_URL}/" 2>/dev/null | grep -q 'PREFIX ldes:'; do
          echo "LDES server not yet returning expected content, retrying in 5s..."
          sleep 5
        done
        echo "LDES server is ready. $${SERVER_URL}"

        while IFS= read -r i; do
        [ -z "$$i" ] && continue
          post_to_admin "admin/api/v1/eventstreams" "$$i-stream.ttl"

          if [ -f /config/server/$$i-by-page.ttl ]; then
            post_to_admin "admin/api/v1/eventstreams/$$i/views" "$$i-by-page.ttl"
          fi
          if [ -f /config/server/$$i-by-time.ttl ]; then
            post_to_admin "admin/api/v1/eventstreams/$$i/views" "$$i-by-time.ttl"
          fi
        done <<EOF
        $$STREAMS
        EOF
    networks:
      - ldes-server

  postgres-ldio-rdb-out:
    container_name: postgres-ldio-rdb-out
    image: postgres:16-alpine
    ports:
      - 5439:5432
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=admin
      - POSTGRES_DB=ldio-rdb-out
    networks:
      - ldio
    healthcheck:
      test: pg_isready -U admin || exit 1
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 5s

  sleep-ldio:
    container_name: sleep
    image: busybox
    command: ["sh", "-c", "sleep 120"]
    depends_on:
      create-eventstreams:
        condition: service_completed_successfully

  ldio:
    container_name: ldio
    image: openldes/ldi-orchestrator:3.1.1
    volumes:
      - ./ldio/application.yml:/ldio/application.yml:ro
      - ./ldio/pipelines/:/ldio/pipelines/:ro
      - ./ldio/queries/:/ldio/queries/:ro
      - ./ldio-rdbms-input/target/ldio-rdbms-input.jar:/ldio/lib/ldio-rdbms-input.jar:ro
      - ./out:/out
    ports:
      - 8091:8080
    networks:
      - ldio
      - ldes-server
      - mjv
    depends_on:
      postgres-ldio-rdb-out:
        condition: service_healthy
      sleep-ldio:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://ldio:8080/actuator/health" ]

networks:
  ldes-server:
  ldio:
  mjv:
